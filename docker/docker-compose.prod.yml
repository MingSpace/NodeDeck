# 生产环境 compose:只走预构建好的 GHCR 镜像,不带 build context
#
# 服务器上的最小目录结构:
#   /opt/nodedeck/
#     docker-compose.prod.yml   <- 本文件(可只 scp 这一份)
#     .env                       <- 从 .env.prod.example 复制并改密码
#     data/                      <- 自动创建,挂卷
#
# 启动:
#   docker compose -f docker-compose.prod.yml up -d
#
# 更新到最新:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# 锁定版本:把 .env 里 IMAGE_TAG=latest 改成 IMAGE_TAG=v0.1.0 之类

services:
  nodedeck:
    image: ${IMAGE:-ghcr.io/mingspace/nodedeck}:${IMAGE_TAG:-latest}
    container_name: nodedeck
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/app/data
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:?must set INITIAL_PASSWORD in .env}
      - SESSION_SECRET=${SESSION_SECRET:?must set SESSION_SECRET in .env (openssl rand -base64 48)}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?must set PUBLIC_BASE_URL in .env}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
